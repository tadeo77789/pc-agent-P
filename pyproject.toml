[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paula-agent"
version = "0.1.0"
description = "Paula Port PC agent: activation, voice, robot UI and whitelisted commands"
readme = "README.md"
requires-python = ">=3.11"
# UI toolkit (PyQt or Tkinter) and hotkey library are still undecided; add them when chosen.
dependencies = [
    "elevenlabs",
    "faster-whisper",
    "pika",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
