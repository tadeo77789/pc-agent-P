[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paula-agent"
version = "0.1.0"
description = "Paula Port PC agent: activation, voice, robot UI and whitelisted commands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "numpy",
    "pika",
    "psutil",
    "python-dotenv",
    "requests",
    "sounddevice",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paula_agent = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
